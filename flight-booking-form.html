<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Booking Form</title>
    <link rel="stylesheet" href="flight-booking-form.css">
</head>
<body>
    <div class="form-container">
        <h1>Flight Booking</h1>
        <form class="horizontal-form" id="flightForm">
            <div class="form-group">
                <label for="originLocationCode">From:</label>
                <input type="text" id="originLocationCode" name="originLocationCode" value="LHE" placeholder="Origin Code" maxlength="3">
            </div>
            
            <div class="form-group">
                <label for="destinationLocationCode">To:</label>
                <input type="text" id="destinationLocationCode" name="destinationLocationCode" value="DXB" placeholder="Destination Code" maxlength="3">
            </div>
            
            <div class="form-group">
                <label for="departureDate">Departure:</label>
                <input type="date" id="departureDate" name="departureDate" value="2025-08-10">
            </div>
            
            <div class="form-group">
                <label for="adults">Adults:</label>
                <input type="number" id="adults" name="adults" value="1" min="1" max="9">
            </div>
            
            <div class="form-group">
                <label for="max">Max Results:</label>
                <input type="number" id="max" name="max" value="5" min="1" max="20">
            </div>
            
            <div class="form-group">
                <button type="submit" class="search-btn">Search Flights</button>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('flightForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = {
                originLocationCode: document.getElementById('originLocationCode').value,
                destinationLocationCode: document.getElementById('destinationLocationCode').value,
                departureDate: document.getElementById('departureDate').value,
                adults: parseInt(document.getElementById('adults').value),
                max: parseInt(document.getElementById('max').value)
            };
            
            console.log('Flight Search Data:', formData);
            alert('Form submitted! Check console for data.');
        });
    </script>
</body>
</html>
