<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amadeus Flight Search</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .form-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 600;
        }

        .horizontal-form {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: end;
            justify-content: center;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            min-width: 120px;
        }

        .form-group label {
            font-weight: 500;
            color: #555;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input {
            padding: 12px 15px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: white;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input:hover {
            border-color: #999;
        }

        .search-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 140px;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .search-btn:active {
            transform: translateY(0);
        }

        .search-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            text-align: center;
            color: #666;
            font-size: 16px;
            margin: 20px 0;
        }

        .results-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 30px;
            backdrop-filter: blur(10px);
            display: none;
        }

        .flight-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border-left: 4px solid #667eea;
        }

        .flight-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .airline-info {
            font-weight: 600;
            color: #333;
        }

        .price {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .flight-details {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 20px;
            align-items: center;
            margin-bottom: 15px;
        }

        .departure, .arrival {
            text-align: center;
        }

        .time {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .airport {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }

        .flight-duration {
            text-align: center;
            color: #666;
            font-size: 14px;
        }

        .flight-segments {
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        .segment {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .segment:last-child {
            margin-bottom: 0;
        }

        .error-message {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .form-container, .results-container {
                padding: 20px;
            }
            
            .horizontal-form {
                flex-direction: column;
                align-items: stretch;
            }
            
            .form-group {
                min-width: auto;
            }

            .flight-details {
                grid-template-columns: 1fr;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <h1>Flight Search</h1>
            <form class="horizontal-form" id="flightForm">
                <div class="form-group">
                    <label for="originLocationCode">From:</label>
                    <input type="text" id="originLocationCode" name="originLocationCode" value="LHE" placeholder="Origin Code" maxlength="3">
                </div>
                
                <div class="form-group">
                    <label for="destinationLocationCode">To:</label>
                    <input type="text" id="destinationLocationCode" name="destinationLocationCode" value="DXB" placeholder="Destination Code" maxlength="3">
                </div>
                
                <div class="form-group">
                    <label for="departureDate">Departure:</label>
                    <input type="date" id="departureDate" name="departureDate" value="2025-08-10">
                </div>
                
                <div class="form-group">
                    <label for="adults">Adults:</label>
                    <input type="number" id="adults" name="adults" value="1" min="1" max="9">
                </div>
                
                <div class="form-group">
                    <label for="max">Max Results:</label>
                    <input type="number" id="max" name="max" value="5" min="1" max="20">
                </div>
                
                <div class="form-group">
                    <button type="submit" class="search-btn" id="searchBtn">Search Flights</button>
                </div>
            </form>
        </div>

        <div class="loading" id="loading" style="display: none;">
            Searching for flights...
        </div>

        <div class="results-container" id="resultsContainer">
            <h2>Flight Results</h2>
            <div id="flightResults"></div>
        </div>
    </div>

    <script>
        // Amadeus API configuration
        const AMADEUS_API_BASE = 'https://test.api.amadeus.com/v2';
        
        // You'll need to get these from Amadeus developer portal
        const CLIENT_ID = 'YOUR_AMADEUS_CLIENT_ID';
        const CLIENT_SECRET = 'YOUR_AMADEUS_CLIENT_SECRET';

        let accessToken = null;

        // Get access token from Amadeus
        async function getAccessToken() {
            try {
                const response = await fetch('https://test.api.amadeus.com/v1/security/oauth2/token', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `grant_type=client_credentials&client_id=${CLIENT_ID}&client_secret=${CLIENT_SECRET}`
                });

                if (!response.ok) {
                    throw new Error('Failed to get access token');
                }

                const data = await response.json();
                return data.access_token;
            } catch (error) {
                console.error('Error getting access token:', error);
                throw error;
            }
        }

        // Search flights using Amadeus API
        async function searchFlights(searchParams) {
            try {
                if (!accessToken) {
                    accessToken = await getAccessToken();
                }

                const queryParams = new URLSearchParams({
                    originLocationCode: searchParams.originLocationCode,
                    destinationLocationCode: searchParams.destinationLocationCode,
                    departureDate: searchParams.departureDate,
                    adults: searchParams.adults,
                    max: searchParams.max,
                    currencyCode: 'USD'
                });

                const response = await fetch(`${AMADEUS_API_BASE}/shopping/flight-offers?${queryParams}`, {
                    headers: {
                        'Authorization': `Bearer ${accessToken}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`API request failed: ${response.status}`);
                }

                const data = await response.json();
                return data.data || [];
            } catch (error) {
                console.error('Error searching flights:', error);
                throw error;
            }
        }

        // Format flight duration
        function formatDuration(duration) {
            return duration.replace('PT', '').replace('H', 'h ').replace('M', 'm');
        }

        // Format price
        function formatPrice(price) {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: price.currency || 'USD'
            }).format(price.total);
        }

        // Display flight results
        function displayFlights(flights) {
            const resultsContainer = document.getElementById('resultsContainer');
            const flightResults = document.getElementById('flightResults');

            if (flights.length === 0) {
                flightResults.innerHTML = '<p style="text-align: center; color: #666;">No flights found for the specified criteria.</p>';
                resultsContainer.style.display = 'block';
                return;
            }

            let html = '';
            flights.forEach(flight => {
                const firstSegment = flight.itineraries[0].segments[0];
                const lastSegment = flight.itineraries[0].segments[flight.itineraries[0].segments.length - 1];
                
                html += `
                    <div class="flight-card">
                        <div class="flight-header">
                            <div class="airline-info">
                                ${flight.validatingAirlineCodes.join(', ')} - ${flight.numberOfBookableSeats} seats available
                            </div>
                            <div class="price">${formatPrice(flight.price)}</div>
                        </div>
                        
                        <div class="flight-details">
                            <div class="departure">
                                <div class="time">${firstSegment.departure.at.substring(11, 16)}</div>
                                <div class="airport">${firstSegment.departure.iataCode}</div>
                            </div>
                            
                            <div class="flight-duration">
                                ${formatDuration(flight.itineraries[0].duration)}
                            </div>
                            
                            <div class="arrival">
                                <div class="time">${lastSegment.arrival.at.substring(11, 16)}</div>
                                <div class="airport">${lastSegment.arrival.iataCode}</div>
                            </div>
                        </div>
                        
                        <div class="flight-segments">
                            ${flight.itineraries[0].segments.map(segment => `
                                <div class="segment">
                                    <span>${segment.departure.iataCode} → ${segment.arrival.iataCode}</span>
                                    <span>${segment.carrierCode} ${segment.number}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });

            flightResults.innerHTML = html;
            resultsContainer.style.display = 'block';
        }

        // Handle form submission
        document.getElementById('flightForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const searchBtn = document.getElementById('searchBtn');
            const loading = document.getElementById('loading');
            const resultsContainer = document.getElementById('resultsContainer');
            
            // Get form data
            const formData = {
                originLocationCode: document.getElementById('originLocationCode').value.toUpperCase(),
                destinationLocationCode: document.getElementById('destinationLocationCode').value.toUpperCase(),
                departureDate: document.getElementById('departureDate').value,
                adults: parseInt(document.getElementById('adults').value),
                max: parseInt(document.getElementById('max').value)
            };

            // Show loading state
            searchBtn.disabled = true;
            searchBtn.textContent = 'Searching...';
            loading.style.display = 'block';
            resultsContainer.style.display = 'none';

            try {
                const flights = await searchFlights(formData);
                displayFlights(flights);
            } catch (error) {
                console.error('Search error:', error);
                document.getElementById('flightResults').innerHTML = `
                    <div class="error-message">
                        Error searching flights: ${error.message}
                        <br><br>
                        <strong>Note:</strong> You need to add your Amadeus API credentials (CLIENT_ID and CLIENT_SECRET) to make this work.
                    </div>
                `;
                resultsContainer.style.display = 'block';
            } finally {
                // Reset button state
                searchBtn.disabled = false;
                searchBtn.textContent = 'Search Flights';
                loading.style.display = 'none';
            }
        });
    </script>
</body>
</html>
